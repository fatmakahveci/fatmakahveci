name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: fatmakahveci
          outputs: |
            dist/github-contribution-grid-snake.svg

      # Keep generated output in Actions artifacts instead of creating a branch.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contribution-snake
          path: dist/github-contribution-grid-snake.svg
          if-no-files-found: error
          retention-days: 30
